<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 1 - Basic HTML Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-heart text-danger"></i>
                <span>Assignment #4</span>
            </a>
            <div class="collapse navbar-collapse show">
                <ul class="nav nav-pills ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Part 1: Basic Forms</a></li>
                    <li class="nav-item"><a class="nav-link" href="bootstrap.html">Part 2: Bootstrap Forms</a></li>
                    <li class="nav-item"><a class="nav-link" href="registration.html">Part 3: Registration Form</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="glass-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="section-title mb-0">Part 1. Basic HTML Forms</h2>
                <span class="badge badge-soft">Task 0 & Task 1</span>
            </div>
            <p class="text-muted">Contact form utilizing HTML5 built-in validation attributes.</p>
            
            <form action="#" method="POST" id="html5-form">
                <div class="mb-3">
                    <label for="basic-name" class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="basic-name" name="name" required minlength="2" maxlength="50" placeholder="e.g. Jane Doe">
                </div>

                <div class="mb-3">
                    <label for="basic-email" class="form-label">Email Address <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="basic-email" name="email" required placeholder="name@example.com">
                </div>

                <div class="mb-3">
                    <label for="basic-message" class="form-label">Message <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="basic-message" name="message" rows="4" required maxlength="300" placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="btn btn-pink">
                    <i class="fa-solid fa-paper-plane me-2"></i>Send Message
                </button>
            </form>
        </div>
    </div>

    <script src="bg.js"></script>
</body>
</html>
